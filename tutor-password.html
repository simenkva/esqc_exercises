<script>
(async function () {
  // SHA-256 hash of the tutor password
  const expectedHash =
    "fbb1eeb89d064f2680346a80fc5c249bde3f73179ebd955b226aadf6d9abec7b";

  // Access already granted on this browser
  if (localStorage.getItem("tutor-access") === "34z5879345789534") {
    return;
  }

  const password = prompt("Tutor version — enter password:");

  if (password !== null) {
    const data = new TextEncoder().encode(password);
    const digest = await crypto.subtle.digest("SHA-256", data);

    const hash = Array.from(new Uint8Array(digest))
      .map(b => b.toString(16).padStart(2, "0"))
      .join("");

    if (hash === expectedHash) {
      localStorage.setItem("tutor-access", "34z5879345789534");
      return;
    }
  }

  // Wrong password or Cancel
  document.documentElement.innerHTML = `
    <head>
      <title>Tutor version</title>
    </head>
    <body style="
      font-family: sans-serif;
      max-width: 40rem;
      margin: 5rem auto;
      padding: 0 2rem;
    ">
      <h2>Tutor version</h2>
      <p>This version is intended for tutors.</p>
      <p>Please use the student version of the site.</p>
    </body>
  `;
})();
</script>
