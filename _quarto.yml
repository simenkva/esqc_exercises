profile:
  default: student
  group:
    - [student, tutor]

project:
  type: book
  pre-render: scripts/generate_recommendations.py
  output-dir: docs
  resources:
    - /figures/**
    - /fonts/**

book:
  title: "ESQC mathematics exercises"
  subtitle: "2026 edition"
  author: "Simen Kvaal"
  date: last-modified
  cover-image: figures/cover-a5.png
  downloads: [epub]
  chapters:
    - index.qmd
    - part: "Exercise recommendations"
      chapters:
        - _generated/recommendations-first-day.qmd
        - _generated/recommendations-per-topic.qmd

    - part: "Mathematical foundations"
      chapters:
        - chapters/sets-and-functions.qmd
        - chapters/cardinality-and-countability.qmd
        - chapters/combinatorics.qmd
    - part: "Linear algebra"
      chapters:
        - chapters/general-vector-spaces.qmd
        - chapters/vectors-and-matrices.qmd
        - chapters/complex-vector-space.qmd
        - chapters/gaussian-elimination.qmd
        - chapters/bra-ket-notation.qmd
        - chapters/eigenvalues-and-diagonalization.qmd
        - chapters/gram-schmidt.qmd
        - chapters/singular-value-decomposition.qmd
        - chapters/polynomial-vector-spaces.qmd

    - part: "Metric spaces and topology"
      chapters:
        - chapters/metric-spaces.qmd
        - chapters/open-and-closed-sets.qmd

    - part: "Calculus"
      chapters: []

    - part: "Multivariable calculus"
      chapters:
        - chapters/visualizing-functions.qmd
        - chapters/continuity-and-differentiability.qmd

    - part: "Series and matrix functions"
      chapters:
        - chapters/matrix-exponentials-and-commutators.qmd

    - part: "Complex numbers and complex analysis"
      chapters:
        - chapters/complex-arithmetic.qmd
        - chapters/complex-sets.qmd
        - chapters/complex-exponential.qmd
        - chapters/complex-power-series.qmd
        - chapters/singularities-and-contour-integrals.qmd

    - part: "Numerical methods"
      chapters:
        - chapters/dual-numbers.qmd
        - chapters/newtons-method.qmd
        - chapters/complex-step-differentiation.qmd

    - part: "Fourier analysis"
      chapters: []

    - part: "Ordinary differential equations"
      chapters: []

    - part: "Partial differential equations"
      chapters: []

    - part: "Optimization"
      chapters: []


bibliography: references.bib

execute:
  echo: false

format:
  html:
    lightbox: true
    theme:
      light: flatly
      dark: darkly
    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml-nofont.js"
    include-in-header: mathjax-config.html
    css:
      - styles.css
      - math_spacing.css
    toc-depth: 3

  epub:
    toc: true
    toc-depth: 3
    css: epub_styles.css
    cover-image: figures/cover-a5.png
    epub-fonts:
      - fonts/RobotoCondensed-Regular.woff2
      - fonts/RobotoCondensed-Medium.woff2
      - fonts/RobotoCondensed-Bold.woff2
      - fonts/STIXTwoText-Regular.woff2
      - fonts/STIXTwoText-Italic.woff2
      - fonts/STIXTwoText-Bold.woff2
      - fonts/STIXTwoText-BoldItalic.woff2
      - fonts/STIXTwoMath-Regular.woff2

custom-callout:
  fact:
    title: "Fact"
    color: "#3EAF3E"
    html:
      icon:
        png: "icons/atom.png"
    epub:
      icon: "icons/atom.png"

  visualization:
    title: "Visualization app"
    color: "#E0479E"
    html:
      icon:
        png: "icons/visualization.png"
    epub:
      icon: "icons/visualization.png"

  learning-goals:
    title: "Learning Goals"
    color: "#8B81FF"
    html:
      icon:
        png: "icons/learning-goals.png"
    epub:
      icon: "icons/learning-goals.png"

  preparations:
    title: "Preparations"
    color: "#8B81FF"
    html:
      icon:
        png: "icons/books.png"
    epub:
      icon: "icons/books.png"

filters:
  - custom-callout
