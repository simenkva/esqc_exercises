      icon:
        png: "icons/atom.png"
    epub:
      icon: "icons/atom.png"

  visualization:
    title: "Visualization app"
    color: "#E0479E"
    html:
      icon:
        png: "icons/visualization.png"
    epub:
      icon: "icons/visualization.png"

  learning-goals:
    title: "Learning Goals"
    color: "#8B81FF"
