profile:
  default: student
  group:
    - [student, tutor]

project:
  type: book
  output-dir: docs
  resources:
    - figures/**
    - fonts/**

book:
  title: "ESQC mathematics exercises"
  subtitle: "2026 edition"
  author: "Simen Kvaal"
  date: last-modified
  cover-image: figures/cover-a5.png
  downloads: [epub]
  chapters:
    - index.qmd
    - part: "Second quantization"
      chapters:
        - chapters/binomial-expansion.qmd
        - chapters/binomial-coefficients.qmd
        - chapters/pascals-triangle.qmd
        - chapters/cauchy-product-of-series.qmd
        - chapters/proof-by-induction-or-direct.qmd
        - chapters/handling-summation-signs.qmd
        - chapters/exponential-as-a-power-series.qmd
        - chapters/partial-derivatives-of-vectors.qmd
        - chapters/eigenvalues-and-eigenvectors-of-a-2x2-matrix.qmd
    - part: "SCF"
      chapters:
        - chapters/matrix-algebra.qmd
    - part: "DFT"
      chapters:
        - chapters/functional-derivatives.qmd
        - chapters/multidimensional-integral-transformations.qmd
    - part: "Response theory"
      chapters:
        - chapters/bch-expansion.qmd
        - chapters/exponentials-of-antihermitian-operators.qmd
        - chapters/poles-and-residues.qmd
        - chapters/fourier-transform.qmd
        - chapters/exponential-forms-of-sine-and-cosine.qmd
        - chapters/eulers-formula.qmd
        - chapters/partial-derivatives-of-dependent-variables.qmd
    - part: "Relativity"
      chapters:
        - chapters/levi-civita-symbol.qmd
        - chapters/roots-of-a-cubic-polynomial.qmd
    - part: "Coupled cluster"
      chapters:
        - chapters/taylor-expansion.qmd
    - part: "Molecular properties"
      chapters:
        - chapters/cross-product-with-levi-civita-symbols.qmd
        - chapters/commutator-of-momentum-and-local-operators.qmd
        - chapters/lagrange-multiplier-method.qmd
        - chapters/total-and-partial-derivatives.qmd
    - part: "Multiconfigurational methods"
      chapters:
        - chapters/resolution-of-the-identity-and-projection-operators.qmd
    - references.qmd

bibliography: references.bib

execute:
  echo: false

format:
  html:
    lightbox: true
    theme:
      light: flatly
      dark: darkly
    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml-nofont.js"
    include-in-header: mathjax-config.html
    css:
      - styles.css
      - math_spacing.css
    toc-depth: 3

  epub:
    toc: true
    toc-depth: 3
    css: epub_styles.css
    cover-image: figures/cover-a5.png
    epub-fonts:
      - fonts/RobotoCondensed-Regular.woff2
      - fonts/RobotoCondensed-Medium.woff2
      - fonts/RobotoCondensed-Bold.woff2
      - fonts/STIXTwoText-Regular.woff2
      - fonts/STIXTwoText-Italic.woff2
      - fonts/STIXTwoText-Bold.woff2
      - fonts/STIXTwoText-BoldItalic.woff2
      - fonts/STIXTwoMath-Regular.woff2

custom-callout:
  fact:
    title: "Fact"
    color: "#3EAF3E"
    html:
      icon:
        png: "icons/atom.png"
    epub:
      icon: "icons/atom.png"

  visualization:
    title: "Visualization app"
    color: "#E0479E"
    html:
      icon:
        png: "icons/visualization.png"
    epub:
      icon: "icons/visualization.png"

  learning-goals:
    title: "Learning Goals"
    color: "#8B81FF"
    html:
      icon:
        png: "icons/learning-goals.png"
    epub:
      icon: "icons/learning-goals.png"

  preparations:
    title: "Preparations"
    color: "#8B81FF"
    html:
      icon:
        png: "icons/books.png"
    epub:
      icon: "icons/books.png"

filters:
  - custom-callout
