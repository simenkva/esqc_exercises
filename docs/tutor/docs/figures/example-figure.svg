<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title description">
  <title id="title">Gaussian probability density</title>
  <desc id="description">A bell-shaped Gaussian curve centered at mu. The interval from mu minus sigma to mu plus sigma is shaded.</desc>

  <defs>
    <linearGradient id="area-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b81ff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#8b81ff" stop-opacity="0.08"/>
    </linearGradient>
    <clipPath id="plot-area">
      <rect x="78" y="54" width="652" height="310" rx="2"/>
    </clipPath>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2c2029"/>
    </marker>
  </defs>

  <rect width="800" height="460" rx="12" fill="#ffffff"/>

  <g clip-path="url(#plot-area)">
    <g fill="none" stroke="#2c2029" stroke-opacity="0.10" stroke-width="1">
      <path d="M80 292 H730 M80 220 H730 M80 148 H730 M80 76 H730"/>
      <path d="M173 54 V364 M266 54 V364 M359 54 V364 M452 54 V364 M545 54 V364 M638 54 V364"/>
    </g>

    <!-- Area within one standard deviation of the mean. -->
    <path d="M312 364 L312 248
             C326 213 342 165 363 126
             C376 101 388 86 405 82
             C422 86 434 101 447 126
             C468 165 484 213 498 248
             L498 364 Z"
          fill="url(#area-fill)"/>

    <g fill="none" stroke="#8b81ff" stroke-width="1.5" stroke-dasharray="6 7" stroke-opacity="0.75">
      <path d="M312 248 V364 M405 82 V364 M498 248 V364"/>
    </g>

    <!-- Gaussian density, drawn symmetrically about mu. -->
    <path d="M80 363
             C150 363 209 357 247 333
             C277 314 293 283 312 248
             C337 201 355 113 390 86
             C395 82 400 80 405 80
             C410 80 415 82 420 86
             C455 113 473 201 498 248
             C517 283 533 314 563 333
             C601 357 660 363 730 363"
          fill="none" stroke="#15967d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="none" stroke="#2c2029" stroke-width="2" stroke-linecap="round">
    <path d="M78 364 H742" marker-end="url(#arrow)"/>
    <path d="M80 374 V48" marker-end="url(#arrow)"/>
    <path d="M312 359 V369 M405 359 V369 M498 359 V369"/>
  </g>

  <g fill="#2c2029" font-family="'STIX Two Text', Georgia, serif" font-size="19">
    <text x="755" y="371" font-style="italic">x</text>
    <text x="52" y="50" font-style="italic">p(x)</text>
    <text x="312" y="396" text-anchor="middle">μ − σ</text>
    <text x="405" y="396" text-anchor="middle">μ</text>
    <text x="498" y="396" text-anchor="middle">μ + σ</text>
  </g>

  <g transform="translate(520 82)">
    <rect width="203" height="54" rx="8" fill="#f5f4ff" stroke="#8b81ff" stroke-opacity="0.35"/>
    <text x="101.5" y="34" text-anchor="middle" fill="#2c2029"
          font-family="'STIX Two Text', Georgia, serif" font-size="17">
      p(x) ∝ exp[−(x−μ)²/(2σ²)]
    </text>
  </g>

  <text x="405" y="434" text-anchor="middle" fill="#5d5360"
        font-family="'Roboto Condensed', Arial, sans-serif" font-size="16" letter-spacing="0.3">
    shaded region: μ ± σ
  </text>
</svg>
